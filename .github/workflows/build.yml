name: Build

on:
  push:
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36 Platform
        run: sdkmanager "platforms;android-36"

      - name: Replace android.jar with patched version
        run: |
          curl -L -o $ANDROID_HOME/platforms/android-36/android.jar https://github.com/Reginer/aosp-android-jar/raw/main/android-34/android.jar

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          
      - uses: gradle/actions/setup-gradle@v4
      
      - name: Build with Gradle
        run: ./gradlew build

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk
